# Render blueprint for the FastAPI backend. The frontend is deployed separately on Vercel (see README).
#
# Free plan: no persistent disk, so SQLite lives on the instance filesystem and the database is recreated and
# re-seeded on every restart. For durable data, switch to a paid plan and add a `disk:` block with DATABASE_URL
# pointing at it (see README, Deployment).
services:
  - type: web
    name: route53-clone-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: SQLite allows a single writer, and the app is tiny.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: COOKIE_SECURE
        value: "true"
      # The browser talks to the Vercel origin and Next.js proxies /api, so CORS isn't exercised in production.
      # Set it to the Vercel URL anyway so direct calls to the API from that origin would also work.
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_USERNAME
        value: admin
      # Choose the demo password in the Render dashboard; it is never stored in this repository.
      - key: DEMO_PASSWORD
        sync: false
