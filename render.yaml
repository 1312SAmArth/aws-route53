# Render blueprint for the FastAPI backend. The frontend is deployed separately on Vercel (see README).
#
# SQLite needs a disk that survives deploys and restarts, and Render only offers persistent disks on
# paid instances. On the free plan, delete the `disk:` block and set `plan: free`: the app then runs
# fine, but the database is recreated and re-seeded from scratch on every restart.
services:
  - type: web
    name: route53-clone-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: SQLite allows a single writer, and the app is tiny.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:////var/data/route53.db
      - key: COOKIE_SECURE
        value: "true"
      # The browser talks to the Vercel origin and Next.js proxies /api, so CORS isn't exercised in production.
      # Set it to the Vercel URL anyway so direct calls to the API from that origin would also work.
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_USERNAME
        value: admin
      # Choose the demo password in the Render dashboard; it is never stored in this repository.
      - key: DEMO_PASSWORD
        sync: false
